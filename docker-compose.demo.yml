name: agora-bbs-demo

networks:
  agora-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgres://agora_user:agora_demo_password@agora-postgres:5432/agora_db?sslmode=disable
  REDIS_ADDR: agora-redis:6379
  TEMPORAL_HOST: agora-temporal:7233
  TEMPORAL_TASK_QUEUE: agora-governance
  JWT_SECRET: agora_classroom_demo_secret_change_before_public_use
  GOVERNANCE_COOLING_SECONDS: 60
  GOVERNANCE_REPLY_DWELL_SECONDS: 10
  GOVERNANCE_LONG_TOPIC_CHARS: 800

services:
  agora-postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: agora_user
      POSTGRES_PASSWORD: agora_demo_password
      POSTGRES_DB: agora_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [agora-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora_user -d agora_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  agora-redis:
    image: docker.io/library/redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [agora-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  agora-temporal:
    image: docker.io/temporalio/auto-setup:1.24.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: agora_user
      POSTGRES_PWD: agora_demo_password
      POSTGRES_SEEDS: agora-postgres
    networks: [agora-network]
    restart: unless-stopped
    depends_on:
      agora-postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe -n default --address agora-temporal:7233 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  agora-temporal-ui:
    image: docker.io/temporalio/ui:2.28.0
    profiles: ["ops"]
    environment:
      TEMPORAL_ADDRESS: agora-temporal:7233
    ports:
      - "127.0.0.1:${DEMO_TEMPORAL_UI_PORT:-8233}:8080"
    networks: [agora-network]
    depends_on: [agora-temporal]

  agora-backend-api:
    image: agora-bbs-demo-backend:local
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-env
    networks: [agora-network]
    restart: unless-stopped
    depends_on:
      agora-postgres: { condition: service_healthy }
      agora-redis: { condition: service_healthy }
      agora-temporal: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/ping"]
      interval: 10s
      timeout: 3s
      retries: 30

  agora-backend-worker:
    image: agora-bbs-demo-backend:local
    build: ./backend
    entrypoint: ["/app/worker"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-env
    networks: [agora-network]
    restart: unless-stopped
    depends_on:
      agora-postgres: { condition: service_healthy }
      agora-redis: { condition: service_healthy }
      agora-temporal: { condition: service_healthy }

  agora-frontend:
    image: agora-bbs-demo-frontend:local
    build: ./frontend
    networks: [agora-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 30

  agora-nginx:
    image: docker.io/library/nginx:1.25-alpine
    ports:
      - "${DEMO_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [agora-network]
    restart: unless-stopped
    depends_on:
      agora-backend-api: { condition: service_healthy }
      agora-frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  agora-demo-seed:
    image: docker.io/library/postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGPASSWORD: agora_demo_password
    volumes:
      - ./backend/seed.sql:/seed.sql:ro
    networks: [agora-network]
    depends_on:
      agora-backend-api: { condition: service_healthy }
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "agora-postgres", "-U", "agora_user", "-d", "agora_db", "-f", "/seed.sql"]
