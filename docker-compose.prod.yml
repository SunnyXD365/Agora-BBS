name: agora-bbs-prod

networks:
  agora-network:

volumes:
  postgres_data:
  redis_data:

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@agora-postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_ADDR: agora-redis:6379
  TEMPORAL_HOST: agora-temporal:7233
  TEMPORAL_TASK_QUEUE: agora-governance
  JWT_SECRET: ${JWT_SECRET}
  LLM_BASE_URL: ${LLM_BASE_URL}
  LLM_MODEL: ${LLM_MODEL}
  LLM_API_KEY: ${LLM_API_KEY}
  GOVERNANCE_COOLING_SECONDS: ${GOVERNANCE_COOLING_SECONDS:-300}
  GOVERNANCE_REPLY_DWELL_SECONDS: ${GOVERNANCE_REPLY_DWELL_SECONDS:-30}
  GOVERNANCE_LONG_TOPIC_CHARS: ${GOVERNANCE_LONG_TOPIC_CHARS:-800}

services:
  agora-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [agora-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  agora-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [agora-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  agora-temporal:
    image: temporalio/auto-setup:1.24.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: agora-postgres
    networks: [agora-network]
    depends_on:
      agora-postgres: { condition: service_healthy }

  agora-temporal-ui:
    image: temporalio/ui:2.28.0
    environment:
      TEMPORAL_ADDRESS: agora-temporal:7233
    ports:
      - "127.0.0.1:${TEMPORAL_UI_HOST_PORT:-8233}:8080"
    networks: [agora-network]
    depends_on: [agora-temporal]

  agora-backend-api:
    build: ./backend
    environment: *backend-env
    networks: [agora-network]
    depends_on:
      agora-postgres: { condition: service_healthy }
      agora-redis: { condition: service_healthy }
      agora-temporal: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  agora-backend-worker:
    build: ./backend
    entrypoint: ["/app/worker"]
    environment: *backend-env
    networks: [agora-network]
    depends_on:
      agora-postgres: { condition: service_healthy }
      agora-redis: { condition: service_healthy }
      agora-temporal: { condition: service_started }
    restart: unless-stopped

  agora-frontend:
    build: ./frontend
    networks: [agora-network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20

  agora-nginx:
    image: nginx:1.25-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [agora-network]
    depends_on:
      agora-backend-api: { condition: service_healthy }
      agora-frontend: { condition: service_healthy }
