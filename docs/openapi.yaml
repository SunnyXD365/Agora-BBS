openapi: 3.1.0
info:
  title: Agora-BBS API
  version: 0.2.0
  description: Agora-BBS v1 公共 HTTP 契约。所有响应均带有 request_id。
servers:
  - url: http://localhost:8080/api/v1
paths:
  /ping:
    get:
      summary: 健康检查
      responses:
        '200': { description: 服务正常 }
  /auth/register:
    post:
      summary: 注册并获取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
  /auth/login:
    post:
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /categories:
    get:
      summary: 获取启用的板块
      responses:
        '200': { description: 板块列表 }
  /topics:
    get:
      summary: 分页获取已发布主题
      parameters:
        - { in: query, name: category_id, schema: { type: integer, format: int64 } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200': { description: 主题分页 }
    post:
      summary: 创建结构化主题
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTopicRequest' }
      responses:
        '200': { description: 创建成功 }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /topics/{id}:
    get:
      summary: 获取主题详情
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 主题详情 }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /topics/{id}/posts:
    get:
      summary: 分页获取主题回复
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 回复分页，parent_id 用于构建回复树 }
    post:
      summary: 创建分层回复
      security: [bearerAuth: []]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 创建成功 }
  /users/me:
    get:
      summary: 获取当前用户
      security: [bearerAuth: []]
      responses:
        '200': { description: 当前用户 }
  /bookmarks:
    get:
      summary: 获取当前用户收藏
      security: [bearerAuth: []]
      responses:
        '200': { description: 收藏分页 }
  /bookmarks/{topicId}:
    put:
      summary: 收藏主题
      security: [bearerAuth: []]
      parameters:
        - { in: path, name: topicId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 收藏成功 }
    delete:
      summary: 取消收藏
      security: [bearerAuth: []]
      parameters:
        - { in: path, name: topicId, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: 取消成功 }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, minLength: 6, maxLength: 32 }
        email: { type: string, format: email }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    StructuredContent:
      type: object
      required: [claim]
      properties:
        claim: { type: string, minLength: 5 }
        evidence: { type: string }
        uncertainty: { type: string }
    CreateTopicRequest:
      type: object
      required: [category_id, title, structured_content]
      properties:
        category_id: { type: integer, format: int64 }
        title: { type: string, minLength: 3, maxLength: 128 }
        structured_content: { $ref: '#/components/schemas/StructuredContent' }
  responses:
    AuthResponse:
      description: 认证成功
    ErrorResponse:
      description: 统一错误响应
